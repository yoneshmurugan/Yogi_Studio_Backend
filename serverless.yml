service: yogi-studio-api
frameworkVersion: '^3.0.0'
useDotenv: true

plugins:
  - serverless-offline
  - serverless-domain-manager
provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}
  # --- GLOBAL RESOURCE TAGS ---
  tags:
    Project: YogiStudio
    Environment: ${self:provider.stage}
    ManagedBy: ServerlessFramework

  environment:
    DYNAMODB_TABLE: YogiStudioData-${self:provider.stage}
    JWT_SECRET: ${env:JWT_SECRET}
    ADMIN_EMAIL: ${env:ADMIN_EMAIL, 'nsbalamurukan1980@gmail.com'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource: "arn:aws:dynamodb:${aws:region}:*:table/${self:provider.environment.DYNAMODB_TABLE}"
        - Effect: Allow
          Action:
            - dynamodb:Query
          Resource: "arn:aws:dynamodb:${aws:region}:*:table/${self:provider.environment.DYNAMODB_TABLE}/index/GSI1"

functions:
  api:
    handler: src/handlers/apiHandler.handler
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true

resources:
  Resources:
    YogiStudioTable:
      Type: 'AWS::DynamoDB::Table'
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        BillingMode: PAY_PER_REQUEST
        # Tags for DynamoDB must be explicitly declared here as well in some CFN versions
        Tags:
          - Key: Project
            Value: YogiStudio
          - Key: Environment
            Value: ${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1_PK
            AttributeType: S
          - AttributeName: GSI1_SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1_PK
                KeyType: HASH
              - AttributeName: GSI1_SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
custom:
  customDomain:
    domainName: api.yogidigitalstudio.in
    stage: ${self:provider.stage}
    basePath: ''
    certificateName: 'api.yogidigitalstudio.in' # Must match exactly what you created in ACM
    createRoute53Record: false # Set to false because your DNS is in Hostinger, not AWS Route53
    endpointType: 'regional'